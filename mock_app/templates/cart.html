<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>购物车 - 扫码点餐</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        .cart-item { border: 1px solid #eee; padding: 12px; margin: 8px 0; }
        .total { font-size: 20px; margin-top: 20px; color: red; }
    </style>
</head>
<body>
    <h1>购物车</h1>
    <div class="welcome">用户：{{ user }}</div>

    {% if items %}
        {% for item in items %}
        <div class="cart-item" data-dish-name="{{ item.name }}">
            <span>{{ item.name }} x {{ item.qty }} = ￥{{ item.subtotal }}</span>
        </div>
        {% endfor %}
        <div class="total" id="total">总计：￥{{ total }}</div>
    {% else %}
        <div id="empty-msg">购物车为空</div>
    {% endif %}

    <a href="/menu" style="display:inline-block; margin-top: 20px;">返回菜单</a>

    {% if items %}
    <a href="/pay" id="go-pay" style="display:inline-block; margin-top: 20px; margin-left: 20px; background: #4CAF50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">去支付</a>
    {% endif %}
</body>
</html>
