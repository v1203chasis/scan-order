name: Python CI - Automated Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 建议与你本地开发版本一致，或者 3.10/3.11
        cache: 'pip' # 开启缓存，加快后续构建速度

    - name: 3. Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Start FastAPI Server in background
      run: |
        # 在后台启动你的 FastAPI 服务，日志输出到 server.log
        uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
        
        # 循环检查服务是否启动成功（最多等 10 秒）
        echo "Waiting for server to start..."
        for i in {1..10}; do
          if curl -s http://127.0.0.1:8000/health > /dev/null; then
            echo "Server is up!"
            break
          fi
          echo "Waiting..."
          sleep 1
        done

    - name: 5. Run Pytest (API Tests)
      env:
        # 注入环境变量，告诉测试代码使用测试环境
        DB_PATH: "test_scan_order.db"
        SECRET_KEY: "ci-secret-key-that-is-at-least-32-bytes-long"
      run: |
        # 运行 tests 目录下的接口测试
        pytest tests/ -v --alluredir=./allure-results

    # 可选：如果你也想在云端跑 Selenium UI 测试，可以取消注释下面这部分
    # - name: 6. Run Selenium UI Tests
    #   env:
    #     HEADLESS: "true"
    #     BASE_URL: "http://127.0.0.1:5000" # 注意：你的 UI 测试似乎在 5000 端口，如果是 8000 请修改
    #   run: |
    #     pytest selenium_test/ -v

    - name: 7. Archive Test Logs (If Failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-logs
        path: server.log